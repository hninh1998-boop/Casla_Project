      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CASLA
          url: https://my426517.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZRP_MAT_CHAR
          description: Báo cáo thể hiện các thuộc tính của mã hàng
          package: ZPK_MAT_CHAR
          transport: AK3K904672
        exclude:
          - /test/
