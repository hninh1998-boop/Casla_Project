# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zrpsalesv2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CASLA
          url: https://my426517.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZRP_SALES_V2
          description: Báo cáo bán hàng - V2
          package: ZPK_SALES_REPORT_V2
          transport: AK3K904907
        exclude:
          - /test/
