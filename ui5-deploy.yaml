# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zmodheadov4
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CASLA
          url: https://my426517.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZM_OD_HEAD_OV4
          description: Mass Upload OD Header
          package: ZPK_MASS_OD_HEAD
          transport: AK3K907850
        exclude:
          - /test/
          - /localService/
