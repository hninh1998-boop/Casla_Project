# This is the resource bundle for zmb51nov4

#Texts for manifest.json

#XTIT: Application name
appTitle=Báo cáo giao dịch kho theo thuộc tính

#YDES: Application description
appDescription=An SAP Fiori application.

#-------------------------------------------------------------------
# List page
#-------------------------------------------------------------------
#XFLD: Panel title for the standalone Main Entity selector
mainEntity.panelTitle=Main Entity

#XFLD: Panel title for the filter bar
filterBar.panelTitle=Filters

#XBUT: Apply filters button
filterBar.go=Go

#XFLD: Name of the built-in, always-present empty view in the "My Views" variant list
variant.standard=Standard

#YMSG: Shown when applying a saved filter view fails
variant.applyError=Could not apply the selected view.

#XBUT: Clears any column sorting on the table, back to the original (unsorted) order
table.resetSort=Reset Sort

#XBUT: Exports the table's current rows to a spreadsheet (.xlsx)
table.export=Export

#XBUT: Opens the column show/hide/reorder settings dialog
table.settings=Settings

#XTIT: Title of the column settings dialog
table.settings.title=View Settings

#XFLD: Header of the settings dialog's column-name list column
table.settings.columns=Columns

#YMSG: Confirmation text shown before Reset restores the default column set/order
table.settings.resetWarning=This will restore the default columns and column order.

#XTOL,XTIT: Tooltip of the per-column "sum by unit" button, and title of the popover it opens
table.totals=Totals

#YMSG: Shown when the sum-by-unit request for the Totals popover fails
table.totalsError=Could not load totals.

#XBUT: Opens the group-by-with-subtotal dialog
table.groupBy=Subtotal

#XTIT: Title of the group-by dialog
groupBy.title=Subtotal

#XFLD: Label for the field picker inside the group-by dialog
groupBy.field=Field

#XBUT: Closes the group-by dialog
groupBy.close=Close

#YMSG: Shown in place of a group's key when the field's value is empty
groupBy.emptyValue=(Blank)

#YMSG: Shown when the group-by dialog's data request fails
groupBy.loadError=Could not load grouped data.

#YMSG: {0}=rows fetched so far, {1}=total row count - live progress while the dialog is loading
groupBy.progress=Loading {0} of {1} rows...

#XBUT: Shown instead of a subtotal value when a group mixes more than one unit for that field
groupBy.showDetails=Show Details

#YMSG: Shown when the ALV-style Excel export fails (see onExportGroupSubtotal)
groupBy.exportError=Could not export the subtotal.

#-------------------------------------------------------------------
# Detail page
#-------------------------------------------------------------------
#XTIT: Detail page title
detail.pageTitle=Material Document Details

#YMSG: Shown when the single-entity read for the selected row's key fails (e.g. 404)
detail.loadError=Could not load this document's details.

#XFLD,30
zmb51n_ov4-display.flpTitle=Báo cáo giao dịch kho theo thuộc tính
