# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zbomcrudauth
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CASLA
          url: https://my426517.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZBOM_CRUD_AUTH
          description: Phân quyền thêm/sửa/xóa BOM
          package: ZPK_ZBOM_RP
          transport: AK3K905055
        exclude:
          - /test/
